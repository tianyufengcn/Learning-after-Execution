# Direct-SFT configuration (supervised Image-to-TikZ initializer).
#
# Schema follows the training entry point exactly: sections `paths`, `data`,
# `model`, `train`. The YAML is loaded verbatim (no shell/YAML variable
# substitution), so local locations are supplied through the loader's own
# environment overrides:
#
#   I2T_MODEL=<Qwen3-VL-8B model dir>       (used when paths.model is empty)
#   I2T_DATA_SOURCE=<train JSONL manifest>  (used when data.source is empty)
#   I2T_OUTPUT_ROOT=<output dir>            (used when paths.output_root is empty)
#   I2T_WORK_ROOT=<working dir>             (optional)
#   I2T_MICRO_BATCH / I2T_GLOBAL_BATCH / I2T_MAX_STEPS / I2T_GRAD_CHECKPOINTING
#   I2T_ATTENTION_BACKEND / I2T_BACKEND / I2T_PROMPT / I2T_DATASET_LIMIT

name: direct_sft

paths:
  # Leave empty and provide I2T_MODEL / I2T_WORK_ROOT / I2T_OUTPUT_ROOT.
  model: ""
  work_root: ""
  output_root: ""

data:
  # Leave empty and provide I2T_DATA_SOURCE (JSONL training manifest).
  source: ""
  cohort_size: 3851
  max_tikz_tokens: 2048
  model_max_length: 4096
  image_size: 448
  strict_image_size: true
  min_pixels: 200704
  max_pixels: 200704
  require_end_document: true
  prompt: |-
    You are an expert Image-to-TikZ model and LaTeX/TikZ developer.
    Study the provided target image carefully and reconstruct it as a high-quality
    TikZ figure. Focus on the visible objects, geometry, topology, text and
    mathematical labels, colors, line and arrow styles, relative sizes, alignment,
    and overall layout. Choose the native TikZ, PGFPlots, circuitikz, tikz-cd, or
    other LaTeX drawing constructs that best reproduce the image. Do not invent or
    omit important visible content when it can be represented faithfully.

    OUTPUT REQUIREMENTS

    - Return only raw LaTeX source code. Do not output Markdown fences,
      explanations, review prose, or any text outside the document.
    - Output exactly one complete standalone document. Start with
      \documentclass[tikz]{standalone}; only when a small margin is needed to
      prevent visible clipping, use border=1pt, border=2pt, or border=3pt in the
      same document class.
    - Include every package and TikZ library required by the generated code in the
      preamble. The document must be self-contained, use native TikZ/PGF drawing,
      and compile successfully with pdflatex with shell escape disabled. Do not
      load external files or assets.
    - Reconstruct the target image as faithfully as possible while preserving
      compilability and document completeness.
    - Include exactly one \begin{document} and one matching \end{document}. The
      final non-whitespace content must be \end{document}; stop immediately after
      it.

model:
  attention_backend: flash_attention_2
  lora_r: 256
  lora_alpha: 512
  lora_dropout: 0.05
  lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  exclude_module_substrings: [visual, vision, merger, deepstack]
  gradient_checkpointing: true

train:
  seed: 20260818
  epochs: 3.0
  learning_rate: 1.0e-4
  weight_decay: 0.0
  max_grad_norm: 0.3
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  micro_batch_size: 8
  global_batch_size: 32
  logging_steps: 5
  save_steps: 100
  save_total_limit: 3
  dataloader_num_workers: 6
  dataloader_prefetch_factor: 4
  backend: ddp
  torch_compile: false
  max_steps: -1
  report_to: none
