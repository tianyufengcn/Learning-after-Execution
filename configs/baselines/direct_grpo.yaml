# Direct-GRPO (single-stage, execution-reward) training configuration.
# G=8 generations per target; the reward is the RSim score of the executed
# program, so the reference TikZ is never used as an RL target.

seed: 20260821

model:
  base_model_path: ${BASE_MODEL}
  adapter_path: ${INIT_ADAPTER}
  processor_path: ${BASE_MODEL}
  dtype: bfloat16
  attn_implementation: sdpa
  trust_remote_code: true
  image_size: 448
  min_pixels: 200704
  max_pixels: 200704

data:
  dataset_path: ${RL_DATASET}
  max_samples: 1000

reward:
  backend: rsim_v2
  model_path: ${RSIM_MODEL_PATH}
  compile_failure_reward: 0.0
  score_batch_size: 16
  score_mem_cache_size: 4096
  emd_workers: 2
  feature_cache_dir: ${OUTPUT_ROOT}/direct_grpo/gt_rsim_feats
  log_dir: ${OUTPUT_ROOT}/direct_grpo/rollout_logs
  log_pipeline_events: true
  environment:
    render_workers: 8
    max_pending: 128
    score_batch_size: 16
    score_max_wait_ms: 120
    score_queue_size: 128
  renderer:
    texlive_bin: ${TEXLIVE_BIN}
    pdftoppm_bin: null
    compilers: [pdflatex, lualatex, xelatex]
    compile_timeout_s: 30
    image_size: 448
    dpi: 150
    cache_failures: true
    cache_transient_failures: false
    keep_failed_logs: true
    cache_dir: ${OUTPUT_ROOT}/direct_grpo/render_cache
    tmp_dir: ${OUTPUT_ROOT}/direct_grpo/render_tmp

grpo:
  output_dir: ${OUTPUT_ROOT}/direct_grpo/checkpoints
  run_name: direct_grpo
  loss_type: dr_grpo
  scale_rewards: false
  beta: 0.0
  epsilon: 0.20
  epsilon_high: 0.28
  num_generations: 8
  generation_batch_size: null
  steps_per_generation: 8
  max_prompt_length: 4096
  max_completion_length: 8192
  mask_truncated_completions: true
  temperature: 1.0
  top_p: 0.9
  learning_rate: 5.0e-6
  weight_decay: 1.0e-2
  warmup_ratio: 0.0
  lr_scheduler_type: constant
  max_grad_norm: 1.0
  num_train_epochs: 1.0
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  bf16: true
  gradient_checkpointing: true
  save_steps: 25
  save_total_limit: 6
  logging_steps: 1
  log_completions: true
  # The formal run wrote no reporter output; TRL would otherwise default to
  # TensorBoard.
  report_to: []
